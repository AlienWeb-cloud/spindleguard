name: Control plane

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Control-plane tests
        run: SG_REQUIRE_FULL=1 make test-control
      - name: Bindcheck mutation tests
        run: make test-bindcheck
